---
# OpenSCAP scan configuration

reports_dir: /opt/compliance-reports
scap_content_base: /usr/share/xml/scap/ssg/content

openscap_profiles:
  amazon-linux-2023:
    scap_file: "ssg-al2023-ds.xml"
    cis_level1_profile: "xccdf_org.ssgproject.content_profile_cis"
    cis_level2_profile: "xccdf_org.ssgproject.content_profile_cis_server_l2"
    package_name: "scap-security-guide"

  ubuntu-2204:
    scap_file: "ssg-ubuntu2204-ds.xml"
    cis_level1_profile: "xccdf_org.ssgproject.content_profile_cis_level1_server"
    cis_level2_profile: "xccdf_org.ssgproject.content_profile_cis_level2_server"
    package_name: "ssg-nondebian"

severity_levels:
  - critical
  - high
  - medium
  - low
